services:
  postgres:
    image: postgres:16-alpine
    container_name: valhalla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: valhalla
      POSTGRES_USER: valhalla
      POSTGRES_PASSWORD: requiem_dev
    ports:
      - "5432:5432"
    volumes:
      - valhalla_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valhalla -d valhalla"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  valhalla_data:
